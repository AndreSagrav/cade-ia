name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Build & Release Windows App
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Wine for Electron Builder
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        id: bump_version
        shell: bash
        run: |
          # Bump the version in package.json (patch level, e.g. 2.0.0 -> 2.0.1)
          npm version patch -m "ci: bump version to %s [skip ci]"
          # Get new version
          VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$VERSION" >> $GITHUB_OUTPUT
          # Push version commit back to GitHub
          git push origin main --tags

      - name: Compile Client
        run: npm run build

      - name: Compile Server
        run: npm run build:server

      - name: Build & Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
